<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 110" width="340" height="110" role="img" aria-label="Домашня кухня — смачно, як удома">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c876"/>
      <stop offset="1" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>

  <!-- crown mark, centered above wordmark -->
  <g transform="translate(170 0)">
    <g fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- crown: 3 peaks + base -->
      <path d="M-22 26 L-22 12 L-11 20 L0 8 L11 20 L22 12 L22 26 Z"/>
    </g>
    <g fill="url(#gold)">
      <circle cx="-22" cy="11" r="2"/>
      <circle cx="0" cy="7" r="2.2"/>
      <circle cx="22" cy="11" r="2"/>
    </g>
  </g>

  <!-- wordmark, centered -->
  <text x="170" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="6" fill="url(#gold)">ДОМАШНЯ</text>
  <text x="170" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="400" letter-spacing="10" fill="url(#gold)">КУХНЯ</text>

  <!-- tagline, clearly separated below -->
  <text x="170" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" letter-spacing="1" fill="#9a8552">смачно, як удома</text>
</svg>
